<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>EBH · ইউজার প্যানেল প্রো</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f8fafd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* মেইন কার্ড */
        .user-panel {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        /* হেডার */
        .panel-header {
            padding: 24px 24px 16px 24px;
            background: white;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .logo-main {
            font-size: 2rem;
            font-weight: 800;
            color: #000;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 0.7rem;
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
        }

        .report-tag {
            background: #000;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* ডেট ও রিপোর্ট ইনফো (নন-এডিটেবল) */
        .info-bar {
            background: #f8f8f8;
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #f0f0f0;
        }

        .date-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-info i {
            color: #000;
            font-size: 1.1rem;
        }

        .date-text {
            font-weight: 600;
            color: #000;
            font-size: 0.95rem;
        }

        .report-badge {
            background: #000;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* স্ট্যাটাস কার্ড - আপডেটেড */
        .stats-card {
            margin: 20px 24px 0 24px;
            background: linear-gradient(145deg, #ffffff, #fafafa);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }

        .rate-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #e0e0e0;
        }

        .rate-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rate-box i {
            color: #000;
            font-size: 1.2rem;
        }

        .rate-box .label {
            font-size: 0.8rem;
            color: #666;
        }

        .rate-box .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000;
        }

        .per-text {
            font-size: 0.7rem;
            color: #888;
            margin-left: 2px;
        }

        .total-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ok-count {
            display: flex;
            flex-direction: column;
        }

        .ok-count .label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .ok-count .number {
            font-size: 2.8rem;
            font-weight: 800;
            color: #000;
            line-height: 1;
        }

        .earnings {
            background: #000;
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            text-align: center;
        }

        .earnings .label {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        .earnings .amount {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .earnings .currency {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-left: 2px;
        }

        /* ইনপুট সেকশন */
        .input-area {
            margin: 20px 24px;
        }

        .input-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .input-header .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }

        .input-header .count {
            background: #f0f0f0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 20px;
            background: #fafafa;
            border: 1.5px solid #f0f0f0;
            border-radius: 28px;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #000;
            background: white;
        }

        /* চেক বাটন */
        .check-btn {
            margin: 0 24px 20px 24px;
            width: calc(100% - 48px);
            background: #000;
            border: none;
            padding: 20px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #333;
        }

        .check-btn:active {
            transform: scale(0.98);
            background: #1a1a1a;
        }

        /* রেজাল্ট সেকশন */
        .result-section {
            margin: 0 24px 24px 24px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .result-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }

        .result-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* আপডেটেড রেজাল্ট আইটেম - নতুন কালার */
        .result-item {
            padding: 14px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #f0f0f0;
        }

        /* OK (ডুপ্লিকেট) - গ্রীন, টিক চিহ্ন */
        .result-item.ok {
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            color: #1b5e20;
        }

        .result-item.ok i {
            color: #2e7d32;
        }

        /* NEW - রেড, ক্রস চিহ্ন */
        .result-item.new {
            background: #ffebee;
            border-left: 5px solid #c62828;
            color: #b71c1c;
        }

        .result-item.new i {
            color: #c62828;
        }

        /* ERROR - গ্রে */
        .result-item.error {
            background: #fafafa;
            border-left: 5px solid #9e9e9e;
            color: #616161;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #fafafa;
            border-radius: 28px;
            color: #aaa;
            border: 1px dashed #e0e0e0;
        }

        /* স্পিনার */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* ফুটার */
        .footer {
            background: #fafafa;
            padding: 18px 24px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.7rem;
        }

        .footer-right {
            display: flex;
            gap: 16px;
            color: #ccc;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="user-panel">
        <div class="panel-header">
            <div class="logo-row">
                <div class="logo">
                    <span class="logo-main">EBH</span>
                    <span class="logo-sub">REPORT</span>
                </div>
                <div class="report-tag">EPS</div>
            </div>

            <!-- ডেট ও রিপোর্ট (এডমিন সেট) -->
            <div class="info-bar">
                <div class="date-info">
                    <i class="far fa-calendar-alt"></i>
                    <span class="date-text" id="displayDate">20 FEB 2026</span>
                </div>
                <div class="report-badge" id="reportName">INSTAGRAM REPORT</div>
            </div>
        </div>

        <!-- স্ট্যাটাস কার্ড - রেট ও আর্নিংস -->
        <div class="stats-card">
            <div class="rate-info">
                <div class="rate-box">
                    <i class="fas fa-tag"></i>
                    <div>
                        <div class="label">PER ACCOUNT</div>
                        <div class="value" id="perAccountRate">10.00</div>
                    </div>
                </div>
                <div class="per-text">BDT</div>
            </div>
            
            <div class="total-counter">
                <div class="ok-count">
                    <span class="label">TOTAL OK</span>
                    <span class="number" id="totalOk">0</span>
                </div>
                <div class="earnings">
                    <div class="label">EARNINGS</div>
                    <div class="amount" id="totalEarnings">0</div>
                    <span class="currency">BDT</span>
                </div>
            </div>
        </div>

        <!-- ইনপুট এরিয়া -->
        <div class="input-area">
            <div class="input-header">
                <div class="title">
                    <i class="fas fa-paste" style="color: #000;"></i>
                    <span>USERNAME LIST</span>
                </div>
                <div class="count" id="inputCount">0</div>
            </div>
            <textarea id="userInput" placeholder="EBH_USER_NAMES
rajib.khan.007
user.name@domain
quail.4588451"></textarea>
        </div>

        <!-- চেক বাটন -->
        <button class="check-btn" onclick="checkUsers()" id="checkBtn">
            <i class="fas fa-search" id="btnIcon"></i>
            <span id="btnText">CHECK NOW</span>
            <span id="btnSpinner" class="spinner hidden"></span>
        </button>

        <!-- রেজাল্ট সেকশন -->
        <div class="result-section">
            <div class="result-header">
                <h3><i class="fas fa-list" style="margin-right: 8px;"></i> RESULTS</h3>
                <span class="count" id="resultCount">0</span>
            </div>
            <div id="resultList" class="result-list">
                <div class="empty-state">
                    <i class="fas fa-magic"></i><br>
                    Paste usernames to check
                </div>
            </div>
        </div>

        <!-- ফুটার -->
        <div class="footer">
            <div class="footer-left">
                <i class="fas fa-bolt"></i>
                <span>EBH · FAST CHECK</span>
            </div>
            <div class="footer-right">
                <i class="fas fa-shield-alt"></i>
                <i class="fas fa-infinity"></i>
            </div>
        </div>
    </div>

    <script>
        // Firebase কনফিগার
        const firebaseConfig = {
            apiKey: "AIzaSyAmpKkaw_zpNGbgawtQrUPadBEh55e4mLM",
            authDomain: "free-lancher-24.firebaseapp.com",
            databaseURL: "https://free-lancher-24-default-rtdb.firebaseio.com/",
            projectId: "free-lancher-24",
            storageBucket: "free-lancher-24.firebasestorage.app",
            messagingSenderId: "667574198748",
            appId: "1:667574198748:web:cdd8041e5cb3ec7da8af19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DOM এলিমেন্ট
        const userInput = document.getElementById('userInput');
        const resultListDiv = document.getElementById('resultList');
        const totalOkSpan = document.getElementById('totalOk');
        const totalEarningsSpan = document.getElementById('totalEarnings');
        const inputCountSpan = document.getElementById('inputCount');
        const resultCountSpan = document.getElementById('resultCount');
        const displayDateSpan = document.getElementById('displayDate');
        const reportNameSpan = document.getElementById('reportName');
        const perAccountRateSpan = document.getElementById('perAccountRate');
        const checkBtn = document.getElementById('checkBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // ========== এডমিন থেকে সেট করা ডাটা ==========
        // এই ভ্যালুগুলো এডমিন প্যানেল থেকে আসবে
        const ADMIN_SETTINGS = {
            reportDate: '2026-02-20',
            reportName: 'INSTAGRAM REPORT',
            perAccountRate: 10.00  // প্রতি একাউন্ট রেট
        };

        // ডেট ফরম্যাট
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            return `${date.getDate().toString().padStart(2,'0')} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        displayDateSpan.innerText = formatDate(ADMIN_SETTINGS.reportDate);
        reportNameSpan.innerText = ADMIN_SETTINGS.reportName;
        perAccountRateSpan.innerText = ADMIN_SETTINGS.perAccountRate.toFixed(2);

        // ========== এনকোডিং ==========
        function encodeUsername(username) {
            let encoded = '';
            for (let i = 0; i < username.length; i++) {
                const char = username[i];
                if (char === '.') encoded += '_x2E_';
                else if (char === '#') encoded += '_x23_';
                else if (char === '$') encoded += '_x24_';
                else if (char === '[') encoded += '_x5B_';
                else if (char === ']') encoded += '_x5D_';
                else if (char === '/') encoded += '_x2F_';
                else if (char === '\\') encoded += '_x5C_';
                else encoded += char;
            }
            return encoded;
        }

        // ইউজার চেক ফাংশন
        async function checkUsers() {
            const raw = userInput.value;
            const usernames = raw.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            inputCountSpan.innerText = usernames.length;

            if (usernames.length === 0) {
                resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><br>Enter usernames</div>';
                return;
            }

            // বাটন লোডিং
            btnIcon.classList.add('hidden');
            btnText.innerText = 'CHECKING...';
            btnSpinner.classList.remove('hidden');
            checkBtn.disabled = true;

            resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><br>Checking...</div>';
            
            let okCount = 0;
            const fragment = document.createDocumentFragment();
            
            try {
                const promises = usernames.map(async (username) => {
                    const encodedUsername = encodeUsername(username);
                    try {
                        const snapshot = await db.ref("users/" + encodedUsername).once("value");
                        return { username, exists: snapshot.exists(), error: false };
                    } catch (err) {
                        return { username, exists: false, error: true };
                    }
                });

                const results = await Promise.all(promises);
                
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    
                    if (result.error) {
                        item.classList.add('error');
                        item.innerHTML = `<i class="fas fa-minus-circle"></i> <span>${result.username} → ERROR</span>`;
                    }
                    else if (result.exists) {
                        item.classList.add('ok');  // OK = গ্রীন
                        item.innerHTML = `<i class="fas fa-check-circle"></i> <span>${result.username} → OK</span>`;
                        okCount++;
                        
                        // wGate আপডেট
                        const encoded = encodeUsername(result.username);
                        db.ref("users/" + encoded).once("value").then(snap => {
                            const data = snap.val();
                            const currentWG = data?.wGate || 0;
                            db.ref("users/" + encoded + "/wGate").set(currentWG + 1);
                        }).catch(console.warn);
                    }
                    else {
                        item.classList.add('new');  // NEW = রেড
                        item.innerHTML = `<i class="fas fa-times-circle"></i> <span>${result.username} → NEW</span>`;
                    }
                    
                    fragment.appendChild(item);
                });

                resultListDiv.innerHTML = '';
                resultListDiv.appendChild(fragment);
                
                // ক্যালকুলেশন আপডেট
                totalOkSpan.innerText = okCount;
                const rate = ADMIN_SETTINGS.perAccountRate;
                const earnings = okCount * rate;
                totalEarningsSpan.innerText = earnings.toFixed(2);
                resultCountSpan.innerText = usernames.length;

            } catch (error) {
                console.error('Error:', error);
                resultListDiv.innerHTML = '<div class="empty-state" style="color:#b71c1c;"><i class="fas fa-bug"></i><br>Network error</div>';
            } finally {
                btnIcon.classList.remove('hidden');
                btnText.innerText = 'CHECK NOW';
                btnSpinner.classList.add('hidden');
                checkBtn.disabled = false;
            }
        }

        // ইনপুট কাউন্ট আপডেট
        userInput.addEventListener('input', function() {
            const lines = this.value.split('\n').filter(l => l.trim().length > 0).length;
            inputCountSpan.innerText = lines;
        });

        window.checkUsers = checkUsers;
    </script>
</body>
</html>
