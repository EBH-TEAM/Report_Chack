<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>EBH ইউজার প্যানেল · প্রিমিয়াম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0d0f1a, #0b1120);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* অ্যানিমেটেড ব্যাকগ্রাউন্ড */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(249,115,22,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(251,146,60,0.08) 0%, transparent 50%);
            animation: rotate 60s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* মেইন কার্ড */
        .premium-card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            box-shadow: 0 40px 90px rgba(0,0,0,0.8), 0 0 0 3px rgba(249,115,22,0.5), 0 0 30px rgba(249,115,22,0.3);
            overflow: hidden;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* গ্রেডিয়েন্ট বর্ডার */
        .premium-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #f97316, #fbbf24, #f97316, #fb923c);
            border-radius: 58px;
            z-index: -1;
            animation: borderGlow 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* হেডার সেকশন */
        .hero-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 32px 28px 40px 28px;
            position: relative;
            overflow: hidden;
        }

        .hero-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(249,115,22,0.3) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulse 6s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            margin-bottom: 25px;
        }

        .main-logo {
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fbbf24, #f97316, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(249,115,22,0.5);
            letter-spacing: 3px;
        }

        .user-badge {
            background: rgba(249,115,22,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            color: #fbbf24;
            font-weight: 700;
            font-size: 0.85rem;
            border: 2px solid #f97316;
            box-shadow: 0 0 20px rgba(249,115,22,0.3);
        }

        /* ডেট এবং কাউন্টার */
        .date-counter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            padding: 12px 20px;
            border: 2px solid rgba(249,115,22,0.5);
            backdrop-filter: blur(10px);
        }

        .date-box {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .date-box i {
            font-size: 1.2rem;
            color: #fbbf24;
        }

        .date-box input {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            outline: none;
        }

        .date-box input::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(1) hue-rotate(10deg);
            opacity: 0.8;
        }

        .global-counter {
            background: linear-gradient(90deg, #f97316, #fb923c);
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 0 20px #f97316;
        }

        /* স্ট্যাটাস কার্ড */
        .stats-card {
            background: rgba(255,255,255,0.95);
            margin: -25px 24px 24px 24px;
            padding: 28px 24px;
            border-radius: 40px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.4);
            border: 2px solid #f97316;
            position: relative;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .total-found {
            text-align: center;
        }

        .total-found .label {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-found .number {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f97316, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-top: 5px;
            text-shadow: 0 10px 20px rgba(249,115,22,0.3);
        }

        .found-badge {
            background: #0f172a;
            padding: 12px 20px;
            border-radius: 50px;
            color: #fbbf24;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid #f97316;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .found-badge i {
            color: #f97316;
            font-size: 1.2rem;
        }

        /* ইনপুট সেকশন */
        .input-master {
            padding: 0 24px 24px 24px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #1e293b;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid #e2e8f0;
        }

        .input-label i {
            color: #f97316;
            font-size: 1.2rem;
        }

        .input-label span {
            color: #0f172a;
        }

        .input-label .badge {
            margin-left: auto;
            background: #f97316;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 24px;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 36px;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all 0.3s;
            color: #0f172a;
            font-weight: 500;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.02);
        }

        textarea:focus {
            border-color: #f97316;
            background: white;
            box-shadow: 0 0 0 6px rgba(249,115,22,0.1), inset 0 2px 5px rgba(0,0,0,0.02);
        }

        /* মেগা বাটন */
        .mega-check-btn {
            width: 100%;
            background: linear-gradient(90deg, #f97316, #fb923c, #fbbf24);
            border: none;
            padding: 24px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 800;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px -10px #f97316, 0 0 0 3px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
        }

        .mega-check-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .mega-check-btn:hover::before {
            left: 100%;
        }

        .mega-check-btn:active {
            transform: scale(0.97);
            box-shadow: 0 10px 30px -5px #f97316;
        }

        /* রেজাল্ট সেকশন */
        .result-premium {
            background: white;
            border-radius: 40px;
            padding: 24px;
            border: 2px solid #f1f5f9;
            box-shadow: 0 20px 40px rgba(0,0,0,0.02);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .result-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e293b;
            font-weight: 800;
            font-size: 1.2rem;
        }

        .result-count {
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 30px;
            color: #475569;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .result-grid {
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #f97316 #e2e8f0;
            padding-right: 5px;
        }

        .result-grid::-webkit-scrollbar {
            width: 6px;
        }

        .result-grid::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .result-grid::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 10px;
        }

        /* রেজাল্ট আইটেম স্টাইল */
        .result-item {
            padding: 18px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideUp 0.3s ease;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 6px;
            background: currentColor;
            opacity: 0.5;
        }

        .result-item i {
            width: 24px;
            font-size: 1.2rem;
            position: relative;
            z-index: 2;
        }

        .result-item span {
            position: relative;
            z-index: 2;
            word-break: break-all;
        }

        /* ডুপ্লিকেট (ওকে) স্টাইল */
        .result-item.duplicate {
            background: linear-gradient(90deg, #fef3c7, #fffbeb);
            color: #92400e;
            border-color: #fbbf24;
            box-shadow: 0 5px 15px rgba(251,191,36,0.2);
        }

        .result-item.duplicate i {
            color: #fbbf24;
        }

        /* নিউ ইউজার স্টাইল */
        .result-item.ok {
            background: linear-gradient(90deg, #dcfce7, #f0fdf4);
            color: #166534;
            border-color: #4ade80;
            box-shadow: 0 5px 15px rgba(74,222,128,0.15);
        }

        .result-item.ok i {
            color: #4ade80;
        }

        /* এরর স্টাইল */
        .result-item.error {
            background: linear-gradient(90deg, #fee2e2, #fef2f2);
            color: #991b1b;
            border-color: #f87171;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ফুটার */
        .premium-footer {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 22px 28px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            border-top: 4px solid #f97316;
            position: relative;
        }

        .premium-footer strong {
            color: #f97316;
            font-size: 1rem;
        }

        .footer-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .footer-icons i {
            color: #f97316;
            font-size: 1.2rem;
            opacity: 0.7;
            transition: 0.3s;
        }

        .footer-icons i:hover {
            opacity: 1;
            transform: translateY(-3px);
        }

        /* স্পিনার */
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* এম্পটি স্টেট */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-style: italic;
            background: #f8fafc;
            border-radius: 30px;
            border: 2px dashed #cbd5e1;
        }

        /* টুলটিপ */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 100;
            border: 2px solid #f97316;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

    <script>
        // Firebase কনফিগার
        const firebaseConfig = {
            apiKey: "AIzaSyAmpKkaw_zpNGbgawtQrUPadBEh55e4mLM",
            authDomain: "free-lancher-24.firebaseapp.com",
            databaseURL: "https://free-lancher-24-default-rtdb.firebaseio.com/",
            projectId: "free-lancher-24",
            storageBucket: "free-lancher-24.firebasestorage.app",
            messagingSenderId: "667574198748",
            appId: "1:667574198748:web:cdd8041e5cb3ec7da8af19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DOM এলিমেন্ট
        const userInput = document.getElementById('userInput');
        const resultListDiv = document.getElementById('resultList');
        const totalFoundSpan = document.getElementById('totalFound');
        const globalFoundSpan = document.getElementById('globalFound');
        const resultCountSpan = document.getElementById('resultCount');
        const inputCountSpan = document.getElementById('inputCount');
        const checkBtn = document.getElementById('checkBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const reportDate = document.getElementById('reportDate');

        // ডিফল্ট তারিখ
        reportDate.value = new Date().toISOString().slice(0,10);

        // ========== এনকোডিং/ডিকোডিং ফাংশন ==========
        function encodeUsername(username) {
            let encoded = '';
            for (let i = 0; i < username.length; i++) {
                const char = username[i];
                if (char === '.') encoded += '_x2E_';
                else if (char === '#') encoded += '_x23_';
                else if (char === '$') encoded += '_x24_';
                else if (char === '[') encoded += '_x5B_';
                else if (char === ']') encoded += '_x5D_';
                else if (char === '/') encoded += '_x2F_';
                else if (char === '\\') encoded += '_x5C_';
                else encoded += char;
            }
            return encoded;
        }

        function decodeUsername(encoded) {
            let decoded = '';
            for (let i = 0; i < encoded.length; i++) {
                if (encoded[i] === '_' && i + 5 < encoded.length && encoded[i+1] === 'x') {
                    const code = encoded.substr(i+2, 2);
                    if (code === '2E') { decoded += '.'; i += 5; }
                    else if (code === '23') { decoded += '#'; i += 5; }
                    else if (code === '24') { decoded += '$'; i += 5; }
                    else if (code === '5B') { decoded += '['; i += 5; }
                    else if (code === '5D') { decoded += ']'; i += 5; }
                    else if (code === '2F') { decoded += '/'; i += 5; }
                    else if (code === '5C') { decoded += '\\'; i += 5; }
                    else { decoded += encoded[i]; }
                } else {
                    decoded += encoded[i];
                }
            }
            return decoded;
        }

        // ইউজার চেক ফাংশন
        async function checkUsers() {
            const raw = userInput.value;
            const usernames = raw.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            // ইনপুট কাউন্ট আপডেট
            inputCountSpan.innerText = usernames.length;

            if (usernames.length === 0) {
                resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i> ইউজারনেম লিখুন</div>';
                return;
            }

            // বাটন লোডিং
            btnIcon.classList.add('hidden');
            btnText.innerText = 'চেক হচ্ছে...';
            btnSpinner.classList.remove('hidden');
            checkBtn.disabled = true;

            // রেজাল্ট এলাকা ক্লিয়ার
            resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> চেক হচ্ছে, অপেক্ষা করুন...</div>';
            
            let foundCount = 0;
            const fragment = document.createDocumentFragment();
            
            try {
                // সব ইউজারের জন্য Promise (সমান্তরাল)
                const promises = usernames.map(async (username) => {
                    const encodedUsername = encodeUsername(username);
                    try {
                        const snapshot = await db.ref("users/" + encodedUsername).once("value");
                        return { username, exists: snapshot.exists(), error: false };
                    } catch (err) {
                        return { username, exists: false, error: true };
                    }
                });

                const results = await Promise.all(promises);
                
                // ফলাফল সাজানো
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    
                    if (result.error) {
                        item.classList.add('error');
                        item.innerHTML = `<i class="fas fa-times-circle"></i> <span>${result.username} → ত্রুটি</span>`;
                    }
                    else if (result.exists) {
                        item.classList.add('duplicate'); // ওকে (ডুপ্লিকেট)
                        item.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span>${result.username} → ওকে (ডুপ্লিকেট)</span>`;
                        foundCount++;
                        
                        // wGate আপডেট (ব্যাকগ্রাউন্ডে)
                        const encoded = encodeUsername(result.username);
                        db.ref("users/" + encoded).once("value").then(snap => {
                            const data = snap.val();
                            const currentWG = data?.wGate || 0;
                            db.ref("users/" + encoded + "/wGate").set(currentWG + 1);
                        }).catch(console.warn);
                    }
                    else {
                        item.classList.add('ok'); // নতুন
                        item.innerHTML = `<i class="fas fa-check-circle"></i> <span>${result.username} → নতুন</span>`;
                    }
                    
                    fragment.appendChild(item);
                });

                // রেজাল্ট দেখানো
                resultListDiv.innerHTML = '';
                resultListDiv.appendChild(fragment);
                
                // কাউন্ট আপডেট
                totalFoundSpan.innerText = foundCount;
                globalFoundSpan.innerText = foundCount;
                resultCountSpan.innerText = `${usernames.length}টি`;

            } catch (error) {
                console.error('চেক করতে সমস্যা:', error);
                resultListDiv.innerHTML = '<div class="empty-state" style="color:#b91c1c;"><i class="fas fa-bug"></i> নেটওয়ার্ক বা ফায়ারবেস এরর</div>';
            } finally {
                // বাটন পুনরায় সক্রিয়
                btnIcon.classList.remove('hidden');
                btnText.innerText = 'চেক করুন';
                btnSpinner.classList.add('hidden');
                checkBtn.disabled = false;
            }
        }

        // ইনপুট চেঞ্জে কাউন্ট আপডেট
        userInput.addEventListener('input', function() {
            const lines = this.value.split('\n').filter(l => l.trim().length > 0).length;
            inputCountSpan.innerText = lines;
        });

        // গ্লোবাল ফাংশন
        window.checkUsers = checkUsers;
    </script>
</body>
</html>
