<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>EBH_Report_Chacker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .user-panel {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        /* হেডার */
        .user-header {
            background: #000000;
            padding: 28px 24px 20px 24px;
            color: white;
            border-bottom: 4px solid #f97316;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 2.3rem;
            font-weight: 800;
            color: #f97316;
        }

        .eps-badge {
            background: #f97316;
            color: #000;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        /* ডেট ও রিপোর্ট ডিসপ্লে */
        .info-display {
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249,115,22,0.3);
        }

        .date-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-display i {
            color: #f97316;
        }

        .date-text {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .report-name {
            background: #f97316;
            color: #000;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* কাউন্টার */
        .counter-box {
            margin: 24px 24px 0 24px;
            background: #f8fafc;
            border-radius: 32px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .counter-left .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
        }

        .counter-left .number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #000;
            line-height: 1;
        }

        .found-badge {
            background: #000;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .found-badge i {
            color: #f97316;
        }

        /* ইনপুট এরিয়া */
        .input-area {
            margin: 20px 24px;
        }

        .input-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .input-header .title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-header .count {
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 20px;
            background: #fafafa;
            border: 2px solid #e2e8f0;
            border-radius: 28px;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #f97316;
            background: white;
        }

        /* চেক বাটন */
        .check-btn {
            margin: 0 24px 20px 24px;
            width: calc(100% - 48px);
            background: #000;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #f97316;
        }

        .check-btn:active {
            transform: scale(0.98);
        }

        /* রেজাল্ট সেকশন */
        .result-section {
            margin: 0 24px 24px 24px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .result-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333;
        }

        .result-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* রেজাল্ট আইটেম */
        .result-item {
            padding: 14px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid transparent;
        }

        .result-item.ok {
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            color: #1b5e20;
        }

        .result-item.ok i {
            color: #2e7d32;
        }

        .result-item.new {
            background: #ffebee;
            border-left: 6px solid #c62828;
            color: #b71c1c;
        }

        .result-item.new i {
            color: #c62828;
        }

        .result-item.error {
            background: #fafafa;
            border-left: 6px solid #9e9e9e;
            color: #616161;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #fafafa;
            border-radius: 28px;
            color: #aaa;
            border: 2px dashed #e0e0e0;
        }

        /* নো ডাটা মেসেজ */
        .no-data-message {
            text-align: center;
            padding: 40px 20px;
            background: #fff3e0;
            border-radius: 28px;
            color: #b45309;
            border: 2px dashed #f97316;
        }

        .no-data-message i {
            font-size: 2.5rem;
            color: #f97316;
            margin-bottom: 15px;
            display: block;
        }

        .no-data-message h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #b45309;
        }

        .no-data-message p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        .footer {
            background: #f8fafc;
            padding: 16px 24px;
            text-align: center;
            border-top: 2px solid #e2e8f0;
            color: #64748b;
            font-size: 0.75rem;
        }

        .footer strong {
            color: #f97316;
        }

        /* টোস্ট মেসেজ */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-left: 6px solid #f97316;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        @keyframes slideUp {
            from {
                bottom: 0;
                opacity: 0;
            }
            to {
                bottom: 30px;
                opacity: 1;
            }
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="user-panel">
        <div class="user-header">
            <div class="header-top">
                <span class="logo">EBH_TEAM</span>
                <span class="eps-badge">EBH REPORT</span>
            </div>

            <!-- ডেট ও রিপোর্ট নাম (রিয়েলটাইম আপডেট) -->
            <div class="info-display" id="infoDisplay">
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                    <span class="date-text" id="displayDate">20 FEB 2026</span>
                </div>
                <div class="report-name" id="displayReport">REPORT</div>
            </div>
        </div>

        <!-- কাউন্টার -->
        <div class="counter-box">
            <div class="counter-left">
                <div class="label">TOTAL OK</div>
                <div class="number" id="totalOk">0</div>
            </div>
            <div class="found-badge">
                <i class="fas fa-check-circle"></i>
                <span>Okay ID</span>
            </div>
        </div>

        <!-- ইনপুট এরিয়া -->
        <div class="input-area">
            <div class="input-header">
                <div class="title">
                    <i class="fas fa-paste" style="color: #f97316;"></i>
                    <span>USERNAME LIST</span>
                </div>
                <div class="count" id="inputCount">0</div>
            </div>
            <textarea id="userInput" placeholder="ইউজার নাম পেস্ট করুন 
একলাইনে একটা 
username_1
username_2"></textarea>
        </div>

        <!-- চেক বাটন -->
        <button class="check-btn" onclick="checkUsers()" id="checkBtn">
            <i class="fas fa-search" id="btnIcon"></i>
            <span id="btnText">CHECK NOW</span>
            <span id="btnSpinner" class="spinner hidden"></span>
        </button>

        <!-- রেজাল্ট সেকশন -->
        <div class="result-section">
            <div class="result-header">
                <h3><i class="fas fa-list" style="margin-right: 8px; color: #f97316;"></i> RESULTS</h3>
                <span class="count" id="resultCount">0</span>
            </div>
            <div id="resultList" class="result-list">
                <div class="empty-state">
                    <i class="fas fa-magic"></i><br>
                    Paste usernames to check
                </div>
            </div>
        </div>

        <div class="footer">
            <strong>EBH USER PANEL PRO</strong> · Auto Remove Duplicate
        </div>
    </div>

    <!-- টোস্ট মেসেজের জন্য ডিভ -->
    <div id="toastContainer"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAmpKkaw_zpNGbgawtQrUPadBEh55e4mLM",
            authDomain: "free-lancher-24.firebaseapp.com",
            databaseURL: "https://free-lancher-24-default-rtdb.firebaseio.com/",
            projectId: "free-lancher-24",
            storageBucket: "free-lancher-24.firebasestorage.app",
            messagingSenderId: "667574198748",
            appId: "1:667574198748:web:cdd8041e5cb3ec7da8af19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DOM Elements
        const userInput = document.getElementById('userInput');
        const resultListDiv = document.getElementById('resultList');
        const totalOkSpan = document.getElementById('totalOk');
        const inputCountSpan = document.getElementById('inputCount');
        const resultCountSpan = document.getElementById('resultCount');
        const displayDate = document.getElementById('displayDate');
        const displayReport = document.getElementById('displayReport');
        const checkBtn = document.getElementById('checkBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const toastContainer = document.getElementById('toastContainer');

        // ========== টোস্ট মেসেজ ফাংশন ==========
        function showToast(message, duration = 3000) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerHTML = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, duration);
        }

        // ========== চেক ডাটাবেজ খালি কিনা ==========
        async function checkDatabaseEmpty() {
            try {
                const snapshot = await db.ref("users").once("value");
                return !snapshot.exists(); // true হলে ডাটাবেজ খালি
            } catch (error) {
                console.error('Error checking database:', error);
                return false;
            }
        }

        // ========== এনকোডিং ==========
        function encodeUsername(username) {
            let encoded = '';
            for (let i = 0; i < username.length; i++) {
                const char = username[i];
                if (char === '.') encoded += '_x2E_';
                else if (char === '#') encoded += '_x23_';
                else if (char === '$') encoded += '_x24_';
                else if (char === '[') encoded += '_x5B_';
                else if (char === ']') encoded += '_x5D_';
                else if (char === '/') encoded += '_x2F_';
                else if (char === '\\') encoded += '_x5C_';
                else encoded += char;
            }
            return encoded;
        }

        // ========== ডেট ফরম্যাট ==========
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            return `${date.getDate().toString().padStart(2,'0')} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        // ========== রিপোর্ট সেটিংস লোড (রিয়েলটাইম) ==========
        function loadSettings() {
            db.ref("appSettings").on("value", (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    displayDate.innerText = formatDate(data.reportDate || '2026-02-20');
                    displayReport.innerText = data.reportName || 'INSTAGRAM REPORT';
                }
            });
        }

        // ========== ইউজার চেক (আপডেটেড) ==========
        async function checkUsers() {
            const raw = userInput.value;
            
            // 1. প্রথমে ডাটাবেজ খালি কিনা চেক করুন
            const isDbEmpty = await checkDatabaseEmpty();
            
            if (isDbEmpty) {
                // ডাটাবেজ খালি থাকলে মেসেজ দেখান
                resultListDiv.innerHTML = `
                    <div class="no-data-message">
                        <i class="fas fa-database"></i>
                        <h3>কোনো রিপোর্ট দেওয়া হয়নি</h3>
                        <p>দয়া করে অপেক্ষা করুন রিপোর্ট আসার জন্য</p>
                        <p style="font-size: 0.8rem; margin-top: 15px;">রিপোর্ট আসলেই দিয়ে দেয়া হবে</p>
                    </div>
                `;
                totalOkSpan.innerText = '0';
                resultCountSpan.innerText = '0';
                inputCountSpan.innerText = '0';
                return;
            }

            // 2. ডুপ্লিকেট ইউজারনেম রিমুভ করুন
            const lines = raw.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            // ডুপ্লিকেট রিমুভ (Set ব্যবহার করে)
            const uniqueUsernames = [...new Set(lines)];
            const duplicateCount = lines.length - uniqueUsernames.length;
            
            if (duplicateCount > 0) {
                showToast(`⚠️ ${duplicateCount} টি ডুপ্লিকেট ইউজারনেম বাদ দেওয়া হয়েছে`, 4000);
            }

            // ইনপুট বক্স আপডেট করে ইউনিক ইউজারনেম দেখানো (ঐচ্ছিক)
            // userInput.value = uniqueUsernames.join('\n');

            const usernames = uniqueUsernames;
            inputCountSpan.innerText = usernames.length;

            if (usernames.length === 0) {
                resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><br>Enter usernames</div>';
                return;
            }

            // বাটন লোডিং
            btnIcon.classList.add('hidden');
            btnText.innerText = 'CHECKING...';
            btnSpinner.classList.remove('hidden');
            checkBtn.disabled = true;

            resultListDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><br>Checking...</div>';
            
            let okCount = 0;
            const fragment = document.createDocumentFragment();
            
            try {
                const promises = usernames.map(async (username) => {
                    const encodedUsername = encodeUsername(username);
                    try {
                        const snapshot = await db.ref("users/" + encodedUsername).once("value");
                        return { username, exists: snapshot.exists(), error: false };
                    } catch (err) {
                        return { username, exists: false, error: true };
                    }
                });

                const results = await Promise.all(promises);
                
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    
                    if (result.error) {
                        item.classList.add('error');
                        item.innerHTML = `<i class="fas fa-minus-circle"></i> <span>${result.username} → ERROR</span>`;
                    }
                    else if (result.exists) {
                        item.classList.add('ok');
                        item.innerHTML = `<i class="fas fa-check-circle"></i> <span>${result.username} → OK</span>`;
                        okCount++;
                        
                        // wGate আপডেট
                        const encoded = encodeUsername(result.username);
                        db.ref("users/" + encoded).once("value").then(snap => {
                            const data = snap.val();
                            const currentWG = data?.wGate || 0;
                            db.ref("users/" + encoded + "/wGate").set(currentWG + 1);
                        }).catch(console.warn);
                    }
                    else {
                        item.classList.add('new');
                        item.innerHTML = `<i class="fas fa-times-circle"></i> <span>${result.username} → Back</span>`;
                    }
                    
                    fragment.appendChild(item);
                });

                resultListDiv.innerHTML = '';
                resultListDiv.appendChild(fragment);
                
                totalOkSpan.innerText = okCount;
                resultCountSpan.innerText = usernames.length;

            } catch (error) {
                console.error('Error:', error);
                resultListDiv.innerHTML = '<div class="empty-state" style="color:#b71c1c;"><i class="fas fa-bug"></i><br>Network error</div>';
            } finally {
                btnIcon.classList.remove('hidden');
                btnText.innerText = 'CHECK NOW';
                btnSpinner.classList.add('hidden');
                checkBtn.disabled = false;
            }
        }

        // ইনপুট কাউন্ট আপডেট
        userInput.addEventListener('input', function() {
            const lines = this.value.split('\n').filter(l => l.trim().length > 0).length;
            inputCountSpan.innerText = lines;
        });

        // ইনিশিয়াল লোড
        loadSettings();

        // গ্লোবাল ফাংশন
        window.checkUsers = checkUsers;
    </script>
</body>
</html>
