<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>EBH · অ্যাডমিন প্রো</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0f1f, #0b1120);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .admin-panel {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 2px solid #f97316;
        }

        /* হেডার */
        .admin-header {
            background: #000000;
            padding: 24px 24px 18px 24px;
            color: white;
            border-bottom: 4px solid #f97316;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: #f97316;
            letter-spacing: -1px;
        }

        .admin-badge {
            background: #f97316;
            color: #000;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-sub {
            font-size: 0.75rem;
            color: #aaa;
        }

        /* কন্ট্রোল এরিয়া */
        .control-area {
            padding: 20px;
        }

        /* === কম্প্যাক্ট রিপোর্ট সেটিংস কার্ড === */
        .compact-card {
            background: #f8fafc;
            border-radius: 40px;
            padding: 18px 20px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f97316;
        }

        .card-title i {
            color: #f97316;
        }

        /* থ্রি-ইন-ওয়ান রো */
        .settings-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .date-compact {
            flex: 1.2;
            min-width: 130px;
        }

        .name-compact {
            flex: 2;
            min-width: 150px;
        }

        .btn-compact {
            flex: 0.7;
            min-width: 90px;
        }

        .compact-input {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .compact-input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.1);
        }

        .compact-btn {
            width: 100%;
            background: #f97316;
            color: #000;
            border: none;
            padding: 14px 10px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #f97316;
            white-space: nowrap;
        }

        .compact-btn i {
            font-size: 0.9rem;
        }

        .compact-btn:active {
            transform: scale(0.96);
            background: #e5670e;
        }

        /* ইউজার ম্যানেজমেন্ট কার্ড */
        .control-card {
            background: #f8fafc;
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group textarea {
            width: 100%;
            padding: 16px 18px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            height: 110px;
        }

        .input-group textarea:focus {
            border-color: #f97316;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #000000;
            color: white;
            border: 2px solid #f97316;
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
            border: 2px solid #fecaca;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* প্রিভিউ বক্স */
        .preview-box {
            background: #000;
            color: white;
            border-radius: 40px;
            padding: 18px 22px;
            margin: 20px 0;
            border: 3px solid #f97316;
        }

        .preview-title {
            color: #f97316;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .preview-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #333;
            font-size: 0.9rem;
        }

        .preview-row:last-child {
            border-bottom: none;
        }

        .preview-label {
            color: #aaa;
        }

        .preview-value {
            font-weight: 700;
            color: #f97316;
        }

        /* ইউজার লিস্ট */
        .user-list-card {
            background: #f8fafc;
            border-radius: 40px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .list-header h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .user-count {
            background: #f97316;
            color: #000;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .user-grid {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-item {
            background: white;
            padding: 12px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #e2e8f0;
            word-break: break-all;
            font-size: 0.85rem;
        }

        .user-item i {
            color: #f97316;
        }

        .empty-state {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            background: white;
            border-radius: 30px;
            border: 2px dashed #cbd5e1;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            background: #f1f5f9;
            padding: 16px 20px;
            text-align: center;
            border-top: 2px solid #e2e8f0;
            font-size: 0.7rem;
            color: #64748b;
        }

        .footer strong {
            color: #f97316;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="admin-panel">
        <div class="admin-header">
            <div class="header-top">
                <span class="logo">EBH</span>
                <span class="admin-badge">MASTER</span>
            </div>
            <div class="header-title">Admin Control</div>
            <div class="header-sub">Manage users & report settings</div>
        </div>

        <div class="control-area">
            <!-- === কম্প্যাক্ট রিপোর্ট সেটিংস (এক লাইনে) === -->
            <div class="compact-card">
                <div class="card-title">
                    <i class="fas fa-sliders-h"></i>
                    <span>REPORT SETTINGS</span>
                </div>

                <!-- থ্রি-ইন-ওয়ান রো -->
                <div class="settings-row">
                    <!-- তারিখ -->
                    <div class="date-compact">
                        <input type="date" id="adminDate" class="compact-input" value="2026-02-20">
                    </div>
                    
                    <!-- রিপোর্ট নাম -->
                    <div class="name-compact">
                        <input type="text" id="adminReportName" class="compact-input" placeholder="Report name" value="INSTAGRAM REPORT">
                    </div>
                    
                    <!-- সেভ বাটন -->
                    <div class="btn-compact">
                        <button class="compact-btn" onclick="saveSettings()">
                            <i class="fas fa-save"></i> SAVE
                        </button>
                    </div>
                </div>
            </div>

            <!-- ইউজার ম্যানেজমেন্ট কার্ড -->
            <div class="control-card">
                <div class="card-title">
                    <i class="fas fa-users"></i>
                    <span>USER MANAGEMENT</span>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-paste"></i> USERNAMES (ONE PER LINE)</label>
                    <textarea id="userInput" placeholder="rajib.khan.007
user.name@domain
quail.4588451"></textarea>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveUsers()">
                        <i class="fas fa-save"></i> SAVE
                    </button>
                    <button class="btn btn-danger" onclick="deleteAllUsers()">
                        <i class="fas fa-trash-alt"></i> DELETE
                    </button>
                </div>
            </div>

            <!-- প্রিভিউ বক্স -->
            <div class="preview-box">
                <div class="preview-title">CURRENT SETTINGS</div>
                <div class="preview-row">
                    <span class="preview-label">Report Date</span>
                    <span class="preview-value" id="previewDate">20 FEB 2026</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Report Name</span>
                    <span class="preview-value" id="previewName">INSTAGRAM REPORT</span>
                </div>
            </div>

            <!-- ইউজার লিস্ট -->
            <div class="user-list-card">
                <div class="list-header">
                    <h3><i class="fas fa-database" style="color: #f97316;"></i> STORED USERS</h3>
                    <span class="user-count" id="userCount">0</span>
                </div>
                <div id="userList" class="user-grid">
                    <div class="empty-state">Loading users...</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <strong>EBH ADMIN PRO</strong> · Compact Design · Real-time Sync
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAmpKkaw_zpNGbgawtQrUPadBEh55e4mLM",
            authDomain: "free-lancher-24.firebaseapp.com",
            databaseURL: "https://free-lancher-24-default-rtdb.firebaseio.com/",
            projectId: "free-lancher-24",
            storageBucket: "free-lancher-24.firebasestorage.app",
            messagingSenderId: "667574198748",
            appId: "1:667574198748:web:cdd8041e5cb3ec7da8af19"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // DOM Elements
        const userInput = document.getElementById('userInput');
        const userListDiv = document.getElementById('userList');
        const userCountSpan = document.getElementById('userCount');
        const adminDate = document.getElementById('adminDate');
        const adminReportName = document.getElementById('adminReportName');
        const previewDate = document.getElementById('previewDate');
        const previewName = document.getElementById('previewName');

        // ========== এনকোডিং ==========
        function encodeUsername(username) {
            let encoded = '';
            for (let i = 0; i < username.length; i++) {
                const char = username[i];
                if (char === '.') encoded += '_x2E_';
                else if (char === '#') encoded += '_x23_';
                else if (char === '$') encoded += '_x24_';
                else if (char === '[') encoded += '_x5B_';
                else if (char === ']') encoded += '_x5D_';
                else if (char === '/') encoded += '_x2F_';
                else if (char === '\\') encoded += '_x5C_';
                else encoded += char;
            }
            return encoded;
        }

        function decodeUsername(encoded) {
            let decoded = '';
            for (let i = 0; i < encoded.length; i++) {
                if (encoded[i] === '_' && i + 5 < encoded.length && encoded[i+1] === 'x') {
                    const code = encoded.substr(i+2, 2);
                    if (code === '2E') { decoded += '.'; i += 5; }
                    else if (code === '23') { decoded += '#'; i += 5; }
                    else if (code === '24') { decoded += '$'; i += 5; }
                    else if (code === '5B') { decoded += '['; i += 5; }
                    else if (code === '5D') { decoded += ']'; i += 5; }
                    else if (code === '2F') { decoded += '/'; i += 5; }
                    else if (code === '5C') { decoded += '\\'; i += 5; }
                    else { decoded += encoded[i]; }
                } else {
                    decoded += encoded[i];
                }
            }
            return decoded;
        }

        // ========== ডেট ফরম্যাট ==========
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            return `${date.getDate().toString().padStart(2,'0')} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        // ========== সেটিংস সেভ ==========
        async function saveSettings() {
            const settings = {
                reportDate: adminDate.value,
                reportName: adminReportName.value
            };

            try {
                await db.ref("appSettings").set(settings);
                alert('✅ Settings updated successfully!');
                updatePreview();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // ========== সেটিংস লোড ==========
        function loadSettings() {
            db.ref("appSettings").on("value", (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    adminDate.value = data.reportDate || '2026-02-20';
                    adminReportName.value = data.reportName || 'INSTAGRAM REPORT';
                }
                updatePreview();
            });
        }

        // ========== প্রিভিউ আপডেট ==========
        function updatePreview() {
            previewDate.innerText = formatDate(adminDate.value);
            previewName.innerText = adminReportName.value;
        }

        // ========== ইউজার সেভ ==========
        async function saveUsers() {
            const raw = userInput.value;
            const usernames = raw.split('\n')
                .map(u => u.trim())
                .filter(u => u.length > 0);

            if (usernames.length === 0) {
                alert('No usernames entered!');
                return;
            }

            const uniqueUsers = [...new Set(usernames)];
            const saveBtn = document.querySelector('.btn-primary');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<span class="spinner"></span> SAVING...';
            saveBtn.disabled = true;

            try {
                const promises = uniqueUsers.map(username => {
                    const encoded = encodeUsername(username);
                    return db.ref("users/" + encoded).set({
                        username: username,
                        wGate: 0,
                        createdAt: new Date().toISOString()
                    });
                });

                await Promise.all(promises);
                alert(`✅ ${uniqueUsers.length} users saved!`);
                userInput.value = '';
                loadUsers();
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }

        // ========== ইউজার লোড ==========
        function loadUsers() {
            db.ref("users").on("value", (snapshot) => {
                const data = snapshot.val();
                userListDiv.innerHTML = '';

                if (data) {
                    const usernames = Object.keys(data).map(key => decodeUsername(key));
                    userCountSpan.innerText = usernames.length;

                    usernames.slice(0, 40).forEach(username => {
                        const item = document.createElement('div');
                        item.className = 'user-item';
                        item.innerHTML = `<i class="fas fa-user-circle"></i> ${username}`;
                        userListDiv.appendChild(item);
                    });

                    if (usernames.length > 40) {
                        const more = document.createElement('div');
                        more.className = 'user-item';
                        more.style.background = '#e2e8f0';
                        more.innerHTML = `<i class="fas fa-ellipsis-h"></i> +${usernames.length - 40} more`;
                        userListDiv.appendChild(more);
                    }
                } else {
                    userListDiv.innerHTML = '<div class="empty-state">No users found</div>';
                    userCountSpan.innerText = '0';
                }
            });
        }

        // ========== ডিলিট অল ==========
        async function deleteAllUsers() {
            if (!confirm('⚠️ Delete ALL users?')) return;

            const deleteBtn = document.querySelector('.btn-danger');
            const originalText = deleteBtn.innerHTML;
            deleteBtn.innerHTML = '<span class="spinner"></span> DELETING...';
            deleteBtn.disabled = true;

            try {
                await db.ref("users").remove();
                alert('✅ All users deleted');
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                deleteBtn.innerHTML = originalText;
                deleteBtn.disabled = false;
            }
        }

        // ইনিশিয়াল লোড
        loadSettings();
        loadUsers();

        // গ্লোবাল ফাংশন
        window.saveSettings = saveSettings;
        window.saveUsers = saveUsers;
        window.deleteAllUsers = deleteAllUsers;
    </script>
</body>
</html>
